{% extends "base.html" %}
{% block title %}{{ 'Edit Event' if event else 'New Event' }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">{{ 'Edit Event' if event else 'New Event' }}</h1>

<form method="post" class="bg-white rounded shadow-sm p-6 space-y-4 max-w-xl">
    <div>
        <label class="block text-sm font-medium mb-1">Event name</label>
        <input type="text" name="name" required
               value="{{ form_data.name if form_data else (event.name if event else '') }}"
               class="w-full border rounded px-3 py-2 text-sm">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Organizer</label>
        <input type="text" name="organizer" required
               value="{{ form_data.organizer if form_data else (event.organizer if event else '') }}"
               class="w-full border rounded px-3 py-2 text-sm">
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Expected attendance</label>
        <input type="number" name="expected_attendance" min="1" required
               value="{{ form_data.expected_attendance if form_data else (event.expected_attendance if event else '') }}"
               class="w-full border rounded px-3 py-2 text-sm">
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium mb-1">Start date/time</label>
            <input type="datetime-local" name="start_datetime" required
                   value="{{ form_data.start_datetime if form_data else (event.start_datetime.strftime('%Y-%m-%dT%H:%M') if event else '') }}"
                   class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">End date/time</label>
            <input type="datetime-local" name="end_datetime" required
                   value="{{ form_data.end_datetime if form_data else (event.end_datetime.strftime('%Y-%m-%dT%H:%M') if event else '') }}"
                   class="w-full border rounded px-3 py-2 text-sm">
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium mb-1">Status</label>
        <select name="status" class="w-full border rounded px-3 py-2 text-sm">
            {% for s in statuses %}
                {% set current = form_data.status if form_data else (event.status if event else 'Draft') %}
                <option value="{{ s }}" {{ 'selected' if s == current }}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="flex gap-3 pt-2">
        <button class="bg-slate-900 text-white text-sm px-4 py-2 rounded hover:bg-slate-700">
            {{ 'Save changes' if event else 'Create event' }}
        </button>
        <a href="{{ url_for('events.list_events') }}" class="text-sm text-slate-500 self-center">Cancel</a>
    </div>
</form>
{% endblock %}
