{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}

<div class="max-w-md mx-auto my-12 bg-white border border-slate-200 rounded-lg p-6 text-center space-y-3">
    <h1 class="text-xl font-bold text-slate-800">500 - Server Error</h1>
    <p class="text-xs text-slate-500">An unexpected error occurred. The transaction was safely rolled back.</p>
    <a href="{{ url_for('dashboard.index') }}" class="inline-block px-3 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded hover:bg-slate-900">
        Return to Dashboard
    </a>
</div>
{% endblock %}
