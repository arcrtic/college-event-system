services:
  - type: web
    name: college-event-system
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --timeout 60"
    plan: free
    # Deploys are triggered by .github/workflows/ci-cd.yml (after tests pass),
    # not by every push -- so README/docs-only commits never redeploy.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: campusalloc-db
          property: externalConnectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSCODE
        value: admin123
      - key: FLASK_DEBUG
        value: "0"
      - key: SHOW_DEMO_LOGIN
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: campusalloc-db
    databaseName: campusalloc
    user: campusalloc_user
    plan: free
