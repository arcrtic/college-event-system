services:
  - type: web
    name: college-event-system
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --timeout 60"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: campusalloc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSCODE
        value: admin123
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: campusalloc-db
    databaseName: campusalloc
    user: campusalloc_user
    plan: free
