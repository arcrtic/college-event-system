services:
  - type: web
    name: college-event-system
    runtime: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn run:app"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusalloc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSCODE
        value: admin123
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: campusalloc-db
    databaseName: campusalloc
    user: campusalloc_user
    plan: free
